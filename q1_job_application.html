<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Portal</title>
  <link rel="stylesheet" href="q1_job_application.css">
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <h1>Job Application Portal</h1>
      <a href="index.html" class="back-link">Back to Home</a>
    </header>

    <main class="form-wrap">
      <form id="jobForm">
        <div class="form-group">
          <label for="name">Applicant Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

        <div class="form-group">
          <label>Gender</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
          </div>
        </div>

        <div class="form-group">
          <label for="qualification">Qualification</label>
          <select id="qualification" name="qualification" required>
            <option value="">Select Qualification</option>
            <option value="Matric">Matric</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Bachelor">Bachelor's Degree</option>
            <option value="Master">Master's Degree</option>
            <option value="PhD">PhD</option>
          </select>
        </div>

        <div class="form-group">
          <label for="position">Job Position</label>
          <select id="position" name="position" required>
            <option value="">Select Job Position</option>
            <option value="Web Developer">Web Developer</option>
            <option value="Software Engineer">Software Engineer</option>
            <option value="UI/UX Designer">UI/UX Designer</option>
            <option value="Graphic Designer">Graphic Designer</option>
            <option value="Project Manager">Project Manager</option>
          </select>
        </div>

        <div class="form-group">
          <label for="city">City</label>
          <input list="cityList" id="city" name="city" placeholder="Enter or select your city" required>
          <datalist id="cityList">
            <option value="Islamabad"></option>
            <option value="Rawalpindi"></option>
            <option value="Wah Cantt"></option>
            <option value="Lahore"></option>
            <option value="Karachi"></option>
            <option value="Peshawar"></option>
            <option value="Faisalabad"></option>
            <option value="Multan"></option>
          </datalist>
        </div>

        <div class="form-group">
          <label for="salary">Expected Salary</label>
          <input type="number" id="salary" name="salary" min="0" placeholder="Enter expected salary" required>
        </div>

        <div class="form-group">
          <label for="date">Available Date</label>
          <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
          <label for="cv">Upload CV</label>
          <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" required>
        </div>

        <div class="form-group">
          <label for="coverLetter">Cover Letter</label>
          <textarea id="coverLetter" name="coverLetter" rows="5" placeholder="Write a short cover letter..." required></textarea>
        </div>

        <div class="button-row">
          <button type="submit" class="btn btn-primary">Submit Application</button>
          <button type="reset" class="btn btn-secondary">Reset</button>
        </div>
      </form>
    </main>
  </div>

  <script src="q1_job_application.js"></script>
</body>
</html>
