<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Media Creator</title>
  <link rel="stylesheet" href="q3_digital_media.css">
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Creator Portfolio</p>
        <h1>Digital Media Creator</h1>
      </div>
      <a href="index.html" class="back-link">Back to Home</a>
    </header>

    <main class="media-grid">
      <section class="media-card">
        <h2>Latest Video Reel</h2>
        <video controls loop muted width="640" height="360" poster="assets/media-poster.svg">
          <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
          <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
          Your browser does not support the video tag.
        </video>
        <p class="note">Replace this sample with your real MP4 and WebM files stored in the assets folder.</p>
      </section>

      <section class="media-card">
        <h2>Podcast Episode</h2>
        <audio controls autoplay loop>
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
          Your browser does not support the audio tag.
        </audio>
        <p class="note">This audio player uses autoplay and loop for demonstration purposes.</p>
      </section>

      <section class="media-card map-card">
        <h2>Location Spotlight</h2>
        <iframe src="https://www.google.com/maps?q=Islamabad%20Pakistan&output=embed" width="100%" height="300" style="border:1px solid #cdcdcd; border-radius:10px;" title="Map location"></iframe>
      </section>
    </main>
  </div>
</body>
</html>
