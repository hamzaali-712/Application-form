<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Event Registration</title>
  <link rel="stylesheet" href="q2_event_registration.css">
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Music Festival</p>
        <h1>Online Event Registration</h1>
      </div>
      <a href="index.html" class="back-link">Back to Home</a>
    </header>

    <main class="form-wrap">
      <form id="eventForm">
        <div class="form-group">
          <label for="participantName">Participant Name</label>
          <input type="text" id="participantName" name="participantName" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
          <label>Gender</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
          </div>
        </div>

        <div class="form-group">
          <label for="ticketType">Ticket Type</label>
          <select id="ticketType" name="ticketType" required>
            <option value="">Select ticket type</option>
            <option value="VIP">VIP</option>
            <option value="Premium">Premium</option>
            <option value="Standard">Standard</option>
            <option value="Student">Student</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ticketCount">Number of Tickets</label>
          <input type="number" id="ticketCount" name="ticketCount" min="1" value="1" required>
        </div>

        <div class="row">
          <div class="form-group half">
            <label for="eventDate">Preferred Event Date</label>
            <input type="date" id="eventDate" name="eventDate" required>
          </div>
          <div class="form-group half">
            <label for="eventTime">Preferred Time</label>
            <input type="time" id="eventTime" name="eventTime" required>
          </div>
        </div>

        <div class="form-group">
          <label>Food Preference</label>
          <div class="radio-group">
            <label><input type="radio" name="food" value="Veg" required> Veg</label>
            <label><input type="radio" name="food" value="Non-Veg"> Non-Veg</label>
            <label><input type="radio" name="food" value="Vegan"> Vegan</label>
          </div>
        </div>

        <div class="form-group">
          <label>Additional Facilities</label>
          <div class="checkboxes">
            <label><input type="checkbox" name="facility" value="Parking"> Parking</label>
            <label><input type="checkbox" name="facility" value="VIP Lounge"> VIP Lounge</label>
            <label><input type="checkbox" name="facility" value="Transport"> Transport</label>
            <label><input type="checkbox" name="facility" value="Merchandise"> Merchandise</label>
          </div>
        </div>

        <div class="form-group">
          <label for="idUpload">Upload Identification Document</label>
          <input type="file" id="idUpload" name="idUpload" accept=".pdf,.jpg,.jpeg,.png" required>
        </div>

        <div class="form-group">
          <label for="comments">Comments</label>
          <textarea id="comments" name="comments" rows="4" placeholder="Write any comments or special requests..."></textarea>
        </div>

        <div class="button-row">
          <button type="submit" class="btn btn-primary">Submit</button>
          <button type="reset" class="btn btn-secondary">Reset</button>
        </div>
      </form>
    </main>
  </div>

  <script src="q2_event_registration.js"></script>
</body>
</html>
